<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORM FEEL 案場管理系統 v2</title>
<style>
:root {
  --cream:#F0EDE8;--stone:#E5E0D8;--bronze:#7A5C3E;--bl:#A07850;--bd:#5A3E28;
  --text:#2C2318;--muted:#8A7A6A;--white:#FDFCFA;--border:#D8D0C4;
  --green:#5A7A5A;--red:#8A3A2A;--amber:#A07828;--blue:#3A5A8A;
  --shadow:0 2px 12px rgba(90,60,30,.10);--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang TC','Noto Sans TC',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--stone)}
::-webkit-scrollbar-thumb{background:var(--bl);border-radius:3px}

/* HEADER */
header{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:14px;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(90,60,30,.08)}
.logo-circle{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 60% 35%,#C8A878,#7A5C3E 55%,#3C2414);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.logo-shape{width:24px;height:18px;position:relative}
.logo-shape::before,.logo-shape::after{content:'';position:absolute;width:11px;height:17px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(135deg,#F0D8B0,#C8A060,#7A4A20)}
.logo-shape::before{left:0;top:0;transform:rotate(-35deg)}
.logo-shape::after{right:0;top:2px;transform:rotate(145deg)}
.brand-name{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--bd)}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1px}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}

/* BUTTONS */
.btn{padding:7px 15px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--bronze);color:#fff}
.btn-primary:hover{background:var(--bd)}
.btn-ghost{background:transparent;color:var(--bronze);border:1.5px solid var(--bl)}
.btn-ghost:hover{background:var(--stone)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#6A2A1A}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:4px}

/* TABS */
.tabs{display:flex;padding:0 24px;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:11px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab.active{color:var(--bronze);border-bottom-color:var(--bronze)}
.tab:hover:not(.active){color:var(--text)}

/* MAIN */
main{padding:20px 24px;max-width:1400px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}

/* SUMMARY CARDS */
.sum-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sum-card{background:var(--white);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-left:3px solid var(--bl)}
.sum-card.warn{border-left-color:var(--amber)}
.sum-card.danger{border-left-color:var(--red)}
.sum-card.ok{border-left-color:var(--green)}
.sum-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.sum-value{font-size:24px;font-weight:700;color:var(--text);margin-top:3px}
.sum-detail{font-size:11px;color:var(--muted);margin-top:2px}

/* SECTION HEADER */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:15px;font-weight:700;color:var(--bd)}

/* PROJECT GRID */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.proj-card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;border:1.5px solid transparent}
.proj-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(90,60,30,.14);border-color:var(--bl)}
.pc-header{padding:13px 16px 9px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pc-name{font-size:15px;font-weight:700}
.pc-addr{font-size:11px;color:var(--muted);margin-top:2px}
.sbadge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
.s施工中{background:#EAF2EA;color:var(--green)}
.s待開工{background:#FEF3DC;color:var(--amber)}
.s已完工{background:#F0F0F0;color:#888}
.s暫停{background:#FDEAEA;color:var(--red)}
.pc-body{padding:0 16px 12px}
.pc-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-bottom:8px}
.mi{font-size:12px}
.ml{color:var(--muted)}
.mv{color:var(--text);font-weight:500}
.atag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.atag.warn{background:#FEF3DC;color:var(--amber)}
.atag.danger{background:#FDEAEA;color:var(--red)}
.atag.info{background:#EEF1F8;color:var(--blue)}
.pbar{height:4px;background:var(--stone);border-radius:2px;overflow:hidden;margin-top:8px}
.pfill{height:100%;background:linear-gradient(90deg,var(--bl),var(--bronze));border-radius:2px}
.pc-footer{padding:7px 16px;border-top:1px solid var(--stone);display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}

/* MODALS */
.overlay{position:fixed;inset:0;background:rgba(30,20,10,.5);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:14px;width:100%;box-shadow:0 20px 60px rgba(30,20,10,.25);overflow:hidden;animation:slideUp .2s ease;position:relative}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhdr{background:linear-gradient(120deg,var(--bd),var(--bronze));padding:18px 22px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.mtitle{font-size:17px;font-weight:700}
.mclose{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.mclose:hover{background:rgba(255,255,255,.25)}
.mbody{padding:22px;max-height:calc(100vh - 140px);overflow-y:auto}

/* MODAL TABS */
.mtabs{display:flex;border-bottom:1px solid var(--stone);margin-bottom:18px;overflow-x:auto}
.mtab{padding:9px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.mtab.active{color:var(--bronze);border-bottom-color:var(--bronze)}
.mpanel{display:none}
.mpanel.active{display:block}

/* FORM */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fg-row{display:grid;gap:12px;margin-bottom:10px}
.fg-2{grid-template-columns:1fr 1fr}
.fg-3{grid-template-columns:1fr 1fr 1fr}
.fl{font-size:12px;font-weight:600;color:var(--muted)}
.fi,.fs,.fta{padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;background:var(--white);color:var(--text);transition:border-color .15s;width:100%}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--bl)}
.fta{resize:vertical;min-height:65px}
.fi[readonly]{background:var(--stone);color:var(--muted)}

/* SECTION CARD */
.sec-card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.sec-card-title{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--bronze);text-transform:uppercase;border-bottom:1px solid var(--stone);padding-bottom:8px;margin-bottom:14px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 11px;background:var(--stone);font-weight:600;font-size:12px;color:var(--muted)}
.tbl td{padding:8px 11px;border-bottom:1px solid var(--stone);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#F8F5F1}

/* STOCK */
.sok{color:var(--green);font-weight:600}
.slow{color:var(--amber);font-weight:600}
.sout{color:var(--red);font-weight:600}

/* GANTT */
.gantt-wrap{overflow-x:auto}
.gtbl{border-collapse:collapse;font-size:12px;min-width:700px;width:100%}
.gtbl th{padding:6px 8px;background:var(--bronze);color:#fff;font-weight:600;font-size:11px;border:1px solid var(--bd);text-align:center}
.gtbl th:first-child{text-align:left;width:120px}
.gtbl td{border:1px solid var(--border);padding:4px 6px;text-align:center}
.gtbl td:first-child{text-align:left;font-weight:600}
.gbar{height:16px;border-radius:3px;background:linear-gradient(90deg,var(--bl),var(--bronze))}
.gbar.pause{background:linear-gradient(90deg,#ccc,#aaa)}
.gbar.done{background:linear-gradient(90deg,var(--green),#3A5A3A)}
.gwknd{background:#F5F0EA}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--stone);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--bd);margin:2px}
.chip-rm{background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;padding:0;line-height:1}
.chip-rm:hover{color:var(--red)}

/* COST */
.cost-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--stone);font-size:13px}
.cost-row:last-child{border-bottom:none}
.cost-lbl{color:var(--muted)}
.cost-val{font-weight:600}
.cost-total{display:flex;justify-content:space-between;padding:11px 16px;background:var(--bd);color:#fff;border-radius:8px;font-weight:700;font-size:15px;margin-top:10px}

/* ALERT ITEM */
.ali{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;border-left:3px solid var(--amber)}
.ali.urgent{border-left-color:var(--red)}

/* AREA CARD */
.area-card{background:var(--stone);border-radius:8px;padding:14px;margin-bottom:10px;position:relative}
.area-img{width:100%;height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px;cursor:pointer}
.area-img-placeholder{width:100%;height:80px;background:var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);margin-bottom:8px;cursor:pointer;border:2px dashed var(--border)}
.area-img-placeholder:hover{border-color:var(--bl);color:var(--bronze)}

/* PAYMENT ROW */
.pay-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--stone);font-size:13px}
.pay-row:last-child{border-bottom:none}

/* WORKER CARD */
.worker-card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;position:relative;cursor:pointer;transition:all .15s;border:1.5px solid transparent}
.worker-card:hover{border-color:var(--bl);transform:translateY(-1px)}
.worker-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--bl),var(--bd));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;flex-shrink:0}
.worker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

/* TOGGLE */
.tog-grp{display:flex;background:var(--stone);border-radius:8px;padding:3px;gap:2px}
.tog-btn{padding:5px 13px;border-radius:6px;border:none;background:transparent;font-size:12px;font-family:inherit;cursor:pointer;color:var(--muted);font-weight:500;transition:all .15s}
.tog-btn.active{background:var(--white);color:var(--bronze);box-shadow:0 1px 4px rgba(90,60,30,.12)}

/* UNIT SWITCH */
.unit-sw{display:inline-flex;background:var(--stone);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.unit-opt{padding:5px 12px;font-size:12px;cursor:pointer;border:none;background:transparent;font-family:inherit;font-weight:500;color:var(--muted);transition:all .15s}
.unit-opt.active{background:var(--bronze);color:#fff}

/* INLINE EDIT */
.editable{cursor:text;border-bottom:1.5px dashed transparent;transition:border-color .15s;min-width:40px;display:inline-block}
.editable:hover{border-bottom-color:var(--bl)}
.editable:focus{outline:none;border-bottom-color:var(--bronze);background:rgba(122,92,62,.05);border-radius:3px 3px 0 0}

/* PROGRESS EDIT */
.prog-wrap{display:flex;align-items:center;gap:10px;margin-top:6px}
.prog-slider{flex:1;accent-color:var(--bronze)}

/* RESPONSIVE */
@media(max-width:768px){
  main{padding:12px}
  .sum-row{grid-template-columns:1fr 1fr}
  .fg-3{grid-template-columns:1fr 1fr}
  .fg-2{grid-template-columns:1fr}
  .mbody{padding:14px}
}

/* TAGS INPUT */
.tags-input{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;min-height:38px;cursor:text;background:var(--white)}
.tags-input:focus-within{border-color:var(--bl)}
.tags-input input{border:none;outline:none;font-size:13px;font-family:inherit;background:transparent;color:var(--text);min-width:80px;flex:1}

/* PHOTO GRID */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.photo-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer}
.photo-add{width:100%;aspect-ratio:1;background:var(--stone);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted);cursor:pointer;border:2px dashed var(--border)}
.photo-add:hover{border-color:var(--bl);color:var(--bronze)}

/* NOTICE */
.notice{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px}
.notice.info{background:#EEF1F8;color:var(--blue);border-left:3px solid var(--blue)}
.notice.warn{background:#FEF3DC;color:var(--amber);border-left:3px solid var(--amber)}
</style>
</head>

const SUPA_URL='https://wourbhpmcuokcwvngfel.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvdXJiaHBtY3Vva2N3dm5nZmVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMzA5MzIsImV4cCI6MjA5NjgwNjkzMn0.kYQ6Bh-8SmeAbxTNFzDGtCkIaePLnOBqUHzrg-lO_Nw';

async function supa(method,table,body=null,params=''){
  const url=`${SUPA_URL}/rest/v1/${table}${params}`;
  const headers={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':''};
  try{
    const res=await fetch(url,{method,headers,body:body?JSON.stringify(body):null});
    if(!res.ok){console.warn('supa err',method,table,res.status);return [];}
    const t=await res.text();return t?JSON.parse(t):[];

  if(el) {
    const v = a.directArea;

    el.textContent = v ? (u==='坪' ? v+' 坪 / '+(v*3.305785).toFixed(2)+' ㎡' : v+' ㎡ / '+(v/3.305785).toFixed(2)+' 坪') : '—';

  a.directUnit = unit;

  const parent = btn.parentElement;
  parent.querySelectorAll('button').forEach(b => {
    const active = b.textContent === unit;
    b.style.background = active ? 'var(--bronze)' : 'transparent';
    b.style.color = active ? '#fff' : 'var(--muted)';

}

// ── IMAGE / FILE COMPRESS ─────────────────
async function compressImg(file, maxW=900, q=0.72){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}
function pickPhoto(cb){
  const i=document.createElement('input');
  i.type='file'; i.accept='image/*'; i.multiple=true;
  i.onchange=async e=>{ for(const f of Array.from(e.target.files)) cb(await compressImg(f)); };
  i.click();
}
async function compressFile(file){
  // For images: compress. For PDF: store as base64 with size warning
  if(file.type.startsWith('image/')){
    return {name:file.name, type:'image', data:await compressImg(file,1200,0.8)};
  }
  return new Promise(res=>{
    if(file.size > 5*1024*1024){ alert('檔案過大（超過5MB），請壓縮後再上傳'); res(null); return; }
    const r=new FileReader();
    r.onload=e=>res({name:file.name, type:'pdf', data:e.target.result});
    r.readAsDataURL(file);
  });
}
function pickFile(cb){
  const i=document.createElement('input');
  i.type='file'; i.accept='.pdf,image/*';
  i.onchange=async e=>{
    if(!e.target.files[0]) return;
    const f=await compressFile(e.target.files[0]);
    if(f) cb(f);
  };
  i.click();
}

function openProject(id) {
  currentProjId = id;
  const p = DB.projects.find(x=>String(x.id)===String(id));
  if(!p) return;
  document.getElementById('pm-title').textContent = p.name;
  document.getElementById('pm-sub').textContent = `${fmtDate(p.startDate)} → ${fmtDate(p.endDate)}`;
  // reset to first tab
  document.querySelectorAll('.mtab').forEach((t,i)=>t.classList.toggle('active',i===0));
  currentMTab = 'basic';
  renderMTab('basic');
  openOverlay('proj-modal');
}

function showMTab(tab, el) {
  if(el) {
    el.closest('.mtabs').querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
  }
  currentMTab = tab;
  renderMTab(tab);
}

function renderMTab(tab) {
  const p = DB.projects.find(x=>String(x.id)===String(currentProjId));
  if(!p) return;
  const body = document.getElementById('pm-body');
  if(tab==='basic') body.innerHTML = renderBasicTab(p);

  else if(tab==='areas') body.innerHTML = renderAreasTab(p);
  else if(tab==='workers-tab') body.innerHTML = renderWorkersTab(p);
  else if(tab==='mats') body.innerHTML = renderMatsTab(p);

  else if(tab==='refimgs') body.innerHTML = renderRefImgsTab(p);
  else if(tab==='samples') body.innerHTML = renderSamplesTab(p);
  else if(tab==='report') body.innerHTML = renderReportTab(p);

}

function addArea() {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const newArea = { id: Date.now(), name:'新區域', width:null, height:null, photos:[], note:'' };
  p.areas.push(newArea);
  renderMTab('areas');
}
function removeArea(aId) {
  const p = DB.projects.find(x=>x.id===currentProjId);
  p.areas = p.areas.filter(a=>String(a.id)!==String(aId));
  renderMTab('areas');
}
function updateAreaName(aId, val) {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const a = p.areas.find(x=>String(x.id)===String(aId));
  if(a) a.name = val;
}
function updateAreaNote(aId, val) {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const a = p.areas.find(x=>String(x.id)===String(aId));
  if(a) a.note = val;
}
function updateAreaDim(aId, dim, val) {
  const p = DB.projects.find(x=>String(x.id)===String(currentProjId));
  const a = p.areas.find(x=>String(x.id)===String(aId));
  if(!a) return;
  a[dim] = parseFloat(val)||null;
  const calc = document.getElementById('area-calc-'+aId);
  if(calc) {
    if(a.width && a.height) {
      const sqm = a.width*a.height;
      calc.textContent = sqm.toFixed(2)+' ㎡ / '+(sqm/3.305785).toFixed(2)+' 坪';
    } else { calc.textContent = '—'; }
  }
}

function addPhoto(aId) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const compressed = await compressImage(file, 800, 0.75);
    const p = DB.projects.find(x=>x.id===currentProjId);
    const a = p.areas.find(x=>String(x.id)===String(aId));
    if(a) { a.photos.push(compressed); renderMTab('areas'); }
  };
  input.click();
}

function compressImage(file, maxW, quality) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if(w > maxW) { h = Math.round(h*maxW/w); w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function lightbox(src) {
  document.getElementById('lb-img').src = src;
  openOverlay('lightbox');

function updateScheduleField(sid, field, val) {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const s = p.schedule.find(x=>String(x.id)===String(sid));
  if(s) s[field] = val;
}
function updateScheduleWorkerRate(sid, name) {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const s = p.schedule.find(x=>String(x.id)===String(sid));
  const w = DB.workers.find(x=>x.name===name);

  renderMTab('workers-tab');
}
function removeSchedule(sid) {
  const p = DB.projects.find(x=>x.id===currentProjId);
  p.schedule = p.schedule.filter(x=>String(x.id)!==String(sid));
  renderMTab('workers-tab');
}
function addScheduleRow() {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const firstW = DB.workers[0]||{name:'師傅',defaultRate:1600};
  p.schedule.push({ id:Date.now(), workerId:firstW.id, workerName:firstW.name, week:'Week 1', days:5, dailyRate:firstW.defaultRate, tasks:'' });
  renderMTab('workers-tab');
}
function refreshScheduleCost() {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const totalLabor = p.schedule.reduce((a,s)=>a+s.days*s.dailyRate,0);
  const totalDays = p.schedule.reduce((a,s)=>a+s.days,0);

  const el1=document.getElementById('sc-labor'),el2=document.getElementById('sc-meal'),el3=document.getElementById('sc-total');
  if(el1) el1.textContent=fmtMoney(totalLabor);
  if(el2) el2.textContent=fmtMoney(mealCost);
  if(el3) el3.textContent=fmtMoney(totalLabor+mealCost+p.fuelCost);
}

function updatePayment(pid, field, val) {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const pay = p.payments.find(x=>x.id===pid);
  if(pay) pay[field] = val;
}
function removePayment(pid) {
  const p = DB.projects.find(x=>x.id===currentProjId);
  p.payments = p.payments.filter(x=>String(x.id)!==String(pid));
  renderMTab('payments');
}
function addPayment() {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const today = new Date().toISOString().slice(0,10);
  p.payments.push({ id:Date.now(), date:today, amount:0, note:'', received:false });
  renderMTab('payments');
}
function refreshPayments() {
  const p = DB.projects.find(x=>x.id===currentProjId);
  const contractEl = document.getElementById('pay-contract');
  if(contractEl) p.client.contractAmt = parseFloat(contractEl.value)||0;
  const received = p.payments.filter(x=>x.received).reduce((a,b)=>a+b.amount,0);
  const rem = (p.client.contractAmt||0) - received;
  const pct = p.client.contractAmt ? Math.round(received/p.client.contractAmt*100) : 0;
  const r=document.getElementById('pay-recv'), rm=document.getElementById('pay-rem');
  if(r) r.value=fmtMoney(received);
  if(rm) { rm.value=fmtMoney(rem); rm.style.color=rem>0?'var(--amber)':'var(--green)'; }
}

async function deleteProject(){
  const p=DB.projects.find(x=>String(x.id)===String(currentProjId));
  if(!p) return;
  if(!confirm('確定要刪除「'+p.name+'」？此操作無法復原。')) return;
  showBanner('刪除中...');
  try{ if(typeof p.id!=='number') await dbDelProject(p.id); }catch(e){console.error(e);}
  DB.projects=DB.projects.filter(x=>String(x.id)!==String(currentProjId));
  hideBanner();
  closeModalDirect(); renderOverview(); renderProjects(); showToast('案場已刪除');
}

function uploadContract(){

    const p=DB.projects.find(x=>String(x.id)===String(currentProjId));

  renderMTab('client');
}
function previewContract(i){
  const p=DB.projects.find(x=>String(x.id)===String(currentProjId));
  const f=p.client.contracts[i];
  if(!f) return;
  const overlay=document.getElementById('contract-preview-overlay');
  document.getElementById('contract-preview-name').textContent=f.name;
  const frame=document.getElementById('contract-preview-frame');
  const img=document.getElementById('contract-preview-img');
  if(f.type==='image'||f.data.startsWith('data:image')){
    frame.style.display='none'; frame.src='';
    img.style.display='block'; img.src=f.data;
  } else {
    img.style.display='none'; img.src='';
    frame.style.display='block'; frame.src=f.data;
  }
  overlay.style.display='flex';
}
function closeContractPreview(){
  const o=document.getElementById('contract-preview-overlay');
  o.style.display='none';
  document.getElementById('contract-preview-frame').src='';
  document.getElementById('contract-preview-img').src='';
}

async function saveProject() {
  const p = DB.projects.find(x=>String(x.id)===String(currentProjId));
  if(!p) return;
  // basic
  const fields = {
    'e-name':'name','e-addr':'address','e-hours':'workHours','e-note':'note'
  };
  Object.entries(fields).forEach(([id,key])=>{ const el=document.getElementById(id); if(el) p[key]=el.value; });
  const eStatus=document.getElementById('e-status'); if(eStatus) p.status=eStatus.value;
  const eParking=document.getElementById('e-parking'); if(eParking) p.parking=eParking.value;
  const eStart=document.getElementById('e-start'); if(eStart) p.startDate=eStart.value;
  const eEnd=document.getElementById('e-end'); if(eEnd) p.endDate=eEnd.value;
  const eFuel=document.getElementById('e-fuel'); if(eFuel) p.fuelCost=parseFloat(eFuel.value)||0;
  const eMeal=document.getElementById('e-meal'); if(eMeal) p.mealAllowance=parseFloat(eMeal.value)||0;
  const eArea=document.getElementById('e-area'); if(eArea) p.areaValue=parseFloat(eArea.value)||0;
  const eProg=document.getElementById('e-prog'); if(eProg) p.progress=parseInt(eProg.value)||0;
  // client
  const cFields = {'c-name':'name','c-contact':'contact','c-phone':'phone','c-email':'email','c-note':'note'};
  Object.entries(cFields).forEach(([id,key])=>{ const el=document.getElementById(id); if(el) p.client[key]=el.value; });
  const cType=document.getElementById('c-type'); if(cType) p.client.isDesignCo=cType.value==='1';
  const cCon=document.getElementById('c-contract'); if(cCon) p.client.contractAmt=parseFloat(cCon.value)||0;
  const pCon=document.getElementById('pay-contract'); if(pCon) p.client.contractAmt=parseFloat(pCon.value)||0;
  // update alerts
  p.alerts = p.materials.filter(m=>m.status==='out').map(m=>m.name+'需補貨').concat(p.materials.filter(m=>m.status==='low').map(m=>m.name+'庫存低'));
  // update header
  document.getElementById('pm-title').textContent = p.name;
  document.getElementById('pm-sub').textContent = `${fmtDate(p.startDate)} → ${fmtDate(p.endDate)}`;
  showBanner('儲存中...');
  try { await dbSaveProject(p); await dbSaveAll(p); } catch(e) { console.error(e); }
  hideBanner();
  renderOverview();
  renderAllCards();
  showToast('已儲存 ✓');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--bd);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;animation:slideUp .2s ease';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2000);
}

  const newP = {

    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="closeOverlay('worker-edit-modal')">取消</button>
      <button class="btn btn-primary" data-wid="${w?w.id:''}" onclick="saveWorker(this.dataset.wid||null)">儲存</button>

async function saveWorker(id) {
  const name = document.getElementById('wf-name').value.trim();
  if(!name) { alert('請填寫姓名'); return; }
  const data = {
    name, phone:document.getElementById('wf-phone').value,
    age:parseInt(document.getElementById('wf-age').value)||0,
    years:parseInt(document.getElementById('wf-years').value)||0,
    defaultRate:parseInt(document.getElementById('wf-rate').value)||1600,
    specialty:document.getElementById('wf-spec').value,
    note:document.getElementById('wf-note').value,
  };
  if(!id || id==='null') { DB.workers.push({ id:DB.nextWId++, ...data }); }
  else { const w=DB.workers.find(x=>String(x.id)===String(id)); if(w) Object.assign(w,data); }
  showBanner('儲存中...');
  try { await dbSaveWorkers(); } catch(e) { console.error(e); }
  hideBanner();
  closeOverlay('worker-edit-modal');
  renderWorkerCards();
  showToast('師傅資料已儲存 ✓');
}
async function deleteWorker(id) {
  if(!confirm('確定刪除此師傅？')) return;
  showBanner('刪除中...');
  try { await dbDelWorker(id); } catch(e) { console.error(e); }
  hideBanner();
  DB.workers = DB.workers.filter(x=>String(x.id)!==String(id));
  closeOverlay('worker-edit-modal');
  renderWorkerCards();
}

// ═══════════════════════════════════════════════
// SCHEDULE (GANTT)
// ═══════════════════════════════════════════════
function renderSchedule() {
  // determine date range
  const allDates = DB.projects.flatMap(p=>[p.startDate,p.endDate].filter(Boolean));
  if(!allDates.length) { document.getElementById('gantt-ct').innerHTML='<div style="color:var(--muted);padding:20px">尚無工期資料</div>'; return; }
  const minD = new Date(allDates.reduce((a,b)=>a<b?a:b));
  const maxD = new Date(allDates.reduce((a,b)=>a>b?a:b));
  document.getElementById('gantt-month').textContent = `${minD.getFullYear()}年${minD.getMonth()+1}月`;
  const dates = [];
  for(let d=new Date(minD); d<=maxD; d.setDate(d.getDate()+1)) dates.push(new Date(d));

  let html = `<table class="gtbl"><thead><tr><th>案場</th>`;
  dates.forEach(d=>{ html+=`<th style="min-width:28px;${d.getDay()==0||d.getDay()==6?'background:#8A7A60':''}">${d.getDate()}</th>`; });
  html += `</tr></thead><tbody>`;
  DB.projects.forEach(p=>{
    const ps = p.startDate ? new Date(p.startDate) : null;
    const pe = p.endDate ? new Date(p.endDate) : null;
    html += `<tr><td>${p.name}</td>`;
    dates.forEach(d=>{
      const inRange = ps && pe && d>=ps && d<=pe;
      const isWeekend = d.getDay()==0||d.getDay()==6;
      if(inRange && !isWeekend) {
        const cls = p.status==='已完工'?'done':p.status==='暫停'?'pause':'';
        html += `<td style="padding:3px 2px"><div class="gbar ${cls}" style="height:14px"></div></td>`;
      } else { html += `<td class="${isWeekend?'gwknd':''}"></td>`; }
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('gantt-ct').innerHTML = html;

  let detail = '';
  DB.projects.filter(p=>p.schedule.length>0).forEach(p=>{
    const totalLabor = p.schedule.reduce((a,s)=>a+s.days*s.dailyRate,0);
    const weeks = [...new Set(p.schedule.map(s=>s.week))];
    detail += `<div class="sec-card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <span style="font-weight:700;font-size:15px">${p.name}</span>
        <span class="sbadge s${p.status}">${p.status}</span>
        <span style="margin-left:auto;font-weight:700;color:var(--bronze)">${fmtMoney(totalLabor)}</span>
      </div>
      <div style="overflow-x:auto">
      <table class="tbl"><thead><tr><th>週次</th><th>師傅</th><th>工天</th><th>日薪</th><th>工項</th><th>小計</th></tr></thead><tbody>`;
    weeks.forEach(wk=>{
      const rows = p.schedule.filter(s=>s.week===wk);
      rows.forEach((s,i)=>{
        detail += `<tr>
          ${i===0?`<td rowspan="${rows.length}" style="font-weight:700">${wk}</td>`:''}
          <td><span class="chip">${s.workerName}</span></td>
          <td>${s.days}</td><td>NT$${s.dailyRate.toLocaleString()}</td>
          <td>${s.tasks}</td>
          <td style="font-weight:600;color:var(--bronze)">NT$${(s.days*s.dailyRate).toLocaleString()}</td>
        </tr>`;
      });
    });
    detail += `</tbody></table></div></div>`;
  });
  document.getElementById('schedule-detail').innerHTML = detail || '<div style="color:var(--muted)">尚無排班資料</div>';
}

    const received = p.payments.filter(x=>x.received).reduce((a,b)=>a+b.amount,0);
    html += `<div class="sec-card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">

      <div class="cost-row"><span class="cost-lbl">工資（${days}工）</span><span class="cost-val">${fmtMoney(labor)}</span></div>
      <div class="cost-row"><span class="cost-lbl">餐費（${days}工 × NT$${p.mealAllowance}）</span><span class="cost-val">${fmtMoney(meal)}</span></div>
      <div class="cost-row"><span class="cost-lbl">油資</span><span class="cost-val">${fmtMoney(p.fuelCost)}</span></div>

      <div class="cost-total"><span>支出小計</span><span>${fmtMoney(labor+meal+p.fuelCost+matCost)}</span></div>
      <div style="margin-top:12px;padding:10px 14px;background:var(--stone);border-radius:8px;font-size:13px">
        <div class="cost-row"><span class="cost-lbl">合約金額</span><span class="cost-val">${fmtMoney(contractAmt)}</span></div>
        <div class="cost-row"><span class="cost-lbl">已收款</span><span class="cost-val" style="color:var(--green)">${fmtMoney(received)}</span></div>
        <div class="cost-row"><span class="cost-lbl">尚餘</span><span class="cost-val" style="color:var(--amber)">${fmtMoney(contractAmt-received)}</span></div>
        <div class="cost-row"><span class="cost-lbl">毛利估算</span><span class="cost-val" style="color:var(--blue)">${fmtMoney(contractAmt-(labor+meal+p.fuelCost+matCost))}</span></div>
      </div>

  });

  html += `<div style="background:var(--bd);color:#fff;border-radius:var(--r);padding:20px">
    <div style="font-weight:700;font-size:16px;margin-bottom:12px">🧮 所有案場合計</div>
    <div class="cost-row" style="border-bottom-color:rgba(255,255,255,.15);font-size:14px"><span style="opacity:.8">工資</span><span>${fmtMoney(gt)}</span></div>
    <div class="cost-row" style="border-bottom-color:rgba(255,255,255,.15);font-size:14px"><span style="opacity:.8">餐費</span><span>${fmtMoney(gm)}</span></div>
    <div class="cost-row" style="border-bottom-color:rgba(255,255,255,.15);font-size:14px"><span style="opacity:.8">油資</span><span>${fmtMoney(gf)}</span></div>
    <div class="cost-row" style="border-bottom-color:rgba(255,255,255,.15);font-size:14px"><span style="opacity:.8">材料採購</span><span>${fmtMoney(gmat)}</span></div>
    <div style="display:flex;justify-content:space-between;padding:10px 0 0;font-size:18px;font-weight:700"><span>總支出</span><span>${fmtMoney(total)}</span></div>
  </div>`;
  document.getElementById('cost-ct').innerHTML = html;
}

// ALERTS
// ═══════════════════════════════════════════════
function renderAlerts() {
  const alerts = [];
  DB.projects.forEach(p=>{
    p.materials.filter(m=>m.status==='out').forEach(m=>{
      alerts.push({ level:'urgent', icon:'📦', title:`${p.name} — ${m.name} 需補貨`, desc:`請在開工前採購`, proj:p.name });
    });
    p.materials.filter(m=>m.status==='low').forEach(m=>{
      alerts.push({ level:'warn', icon:'⚠️', title:`${p.name} — ${m.name} 庫存偏低`, desc:`請確認數量是否足夠`, proj:p.name });
    });
    if(p.schedule.length===0 && p.status==='待開工') {
      alerts.push({ level:'warn', icon:'👷', title:`${p.name} — 尚未安排師傅`, desc:`開工前請確認排班`, proj:p.name });
    }
    if(p.parking==='待確認') {
      alerts.push({ level:'warn', icon:'🚗', title:`${p.name} — 停車位待確認`, desc:`請洽業主或管委會`, proj:p.name });
    }
    if(p.client.contractAmt>0) {
      const received = p.payments.filter(x=>x.received).reduce((a,b)=>a+b.amount,0);
      const pct = Math.round(received/p.client.contractAmt*100);
      if(pct<30 && p.status==='施工中') {
        alerts.push({ level:'warn', icon:'💰', title:`${p.name} — 請款進度偏低（${pct}%）`, desc:`合約 ${fmtMoney(p.client.contractAmt)}，已收 ${fmtMoney(received)}`, proj:p.name });
      }
    }
  });
  document.getElementById('alert-count').textContent = alerts.length;
  document.getElementById('alert-summary').textContent = `待處理 ${alerts.length} 項`;
  document.getElementById('alerts-ct').innerHTML = alerts.length ? alerts.map(a=>`
    <div class="ali ${a.level}">
      <div style="font-size:20px">${a.icon}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">${a.title}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${a.desc}</div>
      </div>
      <button class="btn btn-ghost btn-xs" onclick="openProjectByName('${a.proj}')">查看</button>
    </div>`).join('') : '<div style="text-align:center;padding:40px;color:var(--muted)">🎉 目前沒有待處理提醒</div>';
}

function openProjectByName(name) {
  const p = DB.projects.find(x=>x.name===name);
  if(p) openProject(p.id);
}

async function compressImage(file,maxW=900,q=0.75){return new Promise(res=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.src=e.target.result;};reader.readAsDataURL(file);});}
function lightbox(src){let lb=document.getElementById('lbox');if(!lb){lb=document.createElement('div');lb.id='lbox';lb.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:600;display:flex;align-items:center;justify-content:center;cursor:pointer';lb.onclick=()=>lb.remove();document.body.appendChild(lb);}lb.innerHTML=`<img src="${src}" style="max-width:92%;max-height:88vh;border-radius:8px;object-fit:contain">`;lb.style.display='flex';}

// 圖面參考
function renderRefImgsTab(p){if(!p.refImgs)p.refImgs=[];const imgs=(p.refImgs||[]).map((s,i)=>`<div style="position:relative;display:inline-block;margin:4px"><img src="${s}" style="width:130px;height:130px;object-fit:cover;border-radius:7px;cursor:pointer;border:1px solid var(--border)" onclick="lightbox('${s}')"><button onclick="rmRefImg(${i})" style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px">✕</button></div>`).join('');return `<div style="padding:16px"><div style="font-size:11px;color:var(--muted);margin-bottom:10px">上傳設計師圖面或現場參考照片，方便施工時調閱。</div><div style="margin-bottom:12px">${imgs}</div><button class="btn btn-g btn-sm" onclick="addRefImg()">＋ 新增圖面/照片</button></div>`;}
function addRefImg(){const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.onchange=async e=>{const p=DB.projects.find(x=>String(x.id)===String(currentProjId));if(!p.refImgs)p.refImgs=[];for(const f of Array.from(e.target.files)){p.refImgs.push(await compressImage(f));}renderMTab('refimgs');};input.click();}
function rmRefImg(i){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));if(p.refImgs)p.refImgs.splice(i,1);renderMTab('refimgs');}

// 打板紀錄
function renderSamplesTab(p){if(!p.samples)p.samples=[];const html=(p.samples||[]).map(s=>`<div style="background:var(--stone);border-radius:8px;padding:14px;margin-bottom:10px;border:1px solid var(--border)"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap"><input class="fi" style="font-weight:700;font-size:14px;flex:1;min-width:100px" value="${s.title||''}" onchange="updSamp('${s.id}','title',this.value)"><input class="fi" type="date" style="width:140px" value="${s.date||''}" onchange="updSamp('${s.id}','date',this.value)"><span style="padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:${s.status==='confirmed'?'#EAF2EA':'#FEF3DC'};color:${s.status==='confirmed'?'var(--green)':'var(--amber)'}">${s.status==='confirmed'?'✓定案':'⏳待確認'}</span><button class="btn btn-d btn-xs" onclick="rmSamp('${s.id}')">刪除</button></div><div class="fg" style="margin-bottom:10px"><label class="fl">塗料比例/手法</label><textarea class="fta" style="min-height:55px" onchange="updSamp('${s.id}','ratio',this.value)">${s.ratio||''}</textarea></div><div class="fl" style="margin-bottom:6px">打板照片</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${(s.photos||[]).map((ph,i)=>`<div style="position:relative"><img src="${ph}" style="width:88px;height:88px;object-fit:cover;border-radius:6px;cursor:pointer" onclick="lightbox('${ph}')"><button onclick="rmSampPhoto('${s.id}',${i})" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:10px">✕</button></div>`).join('')}<div onclick="addSampPhoto('${s.id}')" style="width:88px;height:88px;background:var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted);cursor:pointer;border:2px dashed var(--border)">＋</div></div>${s.status==='pending'?`<button class="btn btn-green btn-sm" onclick="confirmSamp('${s.id}')">✓ 業主已確認，填入定案說明</button>`:`<div style="padding:10px;background:#EAF2EA;border-radius:7px"><div class="fl" style="color:var(--green);margin-bottom:5px">✓ 定案說明</div><textarea class="fta" style="min-height:50px" onchange="updSamp('${s.id}','confirmedNote',this.value)">${s.confirmedNote||''}</textarea></div>`}</div>`).join('');return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn btn-g btn-sm" onclick="addSamp()">＋ 新增打板</button></div>${html||'<div style="text-align:center;padding:40px;color:var(--muted)">尚無打板紀錄</div>'}`;}
function updSamp(id,f,v){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const s=(p.samples||[]).find(x=>String(x.id)===String(id));if(s)s[f]=v;}
function addSamp(){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));if(!p.samples)p.samples=[];p.samples.push({id:Date.now(),date:new Date().toISOString().slice(0,10),title:'新打板',ratio:'',photos:[],status:'pending',confirmedNote:''});renderMTab('samples');}
function rmSamp(id){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));p.samples=(p.samples||[]).filter(x=>String(x.id)!==String(id));renderMTab('samples');}
function addSampPhoto(sid){const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.onchange=async e=>{const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const s=(p.samples||[]).find(x=>String(x.id)===String(sid));if(s){for(const f of Array.from(e.target.files))s.photos.push(await compressImage(f));renderMTab('samples');}};input.click();}
function rmSampPhoto(sid,i){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const s=(p.samples||[]).find(x=>String(x.id)===String(sid));if(s){s.photos.splice(i,1);renderMTab('samples');}}
function confirmSamp(id){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const s=(p.samples||[]).find(x=>String(x.id)===String(id));if(s){s.status='confirmed';renderMTab('samples');}}

// 工程日報
const WEATHER_OPTS=['☀️ 晴天','🌤 多雲','☁️ 陰天','🌧 雨天','⛈ 雷雨'];
function renderReportTab(p){
  if(!p.report)p.report=[];
  const sorted=[...p.report].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  // Active editing log id
  if(!window._activeRptId && sorted.length) window._activeRptId = sorted[0].id;
  const activeR = sorted.find(r=>String(r.id)===String(window._activeRptId)) || sorted[0];
  
  // Build summary list (left column)
  const listHtml = sorted.map(r=>{
    const isActive = activeR && String(r.id)===String(activeR.id);
    const workCount = r.workersCount||0;
    return `<div onclick="window._activeRptId='${r.id}';renderMTab('report')" style="background:#fff;border:1px solid ${isActive?'var(--bronze)':'var(--border)'};border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s;${isActive?'box-shadow:0 2px 8px rgba(124,93,58,.15)':''}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:#2a2a2a;margin-bottom:3px">${r.date||'未填日期'} · ${(r.workHours||p.workHours||'').trim()||'—'} · ${(r.weather||'').replace(/[☀️🌤☁️🌧⛈]/gu,'').trim()||'—'}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px">合計 ${workCount} 人 · 負責：${r.manager||'—'}</div>
          ${workCount>0?`<div style="display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;background:var(--stone);color:#555;margin-bottom:6px">油漆工程 ${workCount}人</div>`:''}
          <div style="font-size:12px;color:#444;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all">${r.caption||'（無說明）'}</div>
        </div>
        <button class="btn btn-d btn-xs" onclick="event.stopPropagation();rmRpt('${r.id}')" style="flex-shrink:0">✕</button>
      </div>
    </div>`;
  }).join('');
  
  // Build editor (right column, for the active log)
  let editorHtml = '';
  if(activeR){
    const r = activeR;
    const photos=r.photos||[],caps=r.photoCaptions||[];
    let ph='';
    for(let i=0;i<photos.length;i+=2){
      const s1=photos[i],s2=photos[i+1]||null,c1=caps[i]||'',c2=caps[i+1]||'';
      ph+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div style="border:1px solid var(--border);border-radius:7px;overflow:hidden">
          <img src="${s1}" style="width:100%;height:140px;object-fit:contain;display:block;cursor:pointer;background:#f5f2ee" onclick="lightbox('${s1}')">
          <input class="fi" style="font-size:11px;padding:5px 8px;border:none;border-top:1px solid var(--border);border-radius:0" placeholder="照片說明…" value="${c1}" oninput="updRptCap('${r.id}',${i},this.value)">
        </div>
        <div style="border:1px solid var(--border);border-radius:7px;overflow:hidden">
          ${s2?`<img src="${s2}" style="width:100%;height:140px;object-fit:contain;display:block;cursor:pointer;background:#f5f2ee" onclick="lightbox('${s2}')"><input class="fi" style="font-size:11px;padding:5px 8px;border:none;border-top:1px solid var(--border);border-radius:0" placeholder="照片說明…" value="${c2}" oninput="updRptCap('${r.id}',${i+1},this.value)">`:`<div style="width:100%;height:140px;background:var(--stone);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:22px" onclick="addRptPhoto('${r.id}')">＋</div>`}
        </div>
      </div>`;
    }
    editorHtml = `<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap">
        <div style="font-weight:700;font-size:15px;color:var(--bd)">編輯日誌</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" style="background:var(--bd);color:#fff;border:none" onclick="exportReportPDF('${r.id}')">📄 匯出此日誌</button>
          <button class="btn btn-g btn-sm" onclick="addRptPhoto('${r.id}')">＋ 照片</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="fg" style="margin:0"><label class="fl">日期</label><input class="fi" type="date" value="${r.date||''}" onchange="updRpt('${r.id}','date',this.value);renderMTab('report')"></div>
        <div class="fg" style="margin:0"><label class="fl">天氣</label><select class="fs" onchange="updRpt('${r.id}','weather',this.value);renderMTab('report')">${WEATHER_OPTS.map(w=>`<option ${(r.weather||'☀️ 晴天')===w?'selected':''}>${w}</option>`).join('')}</select></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="fg" style="margin:0"><label class="fl">出工人數</label><input class="fi" type="number" min="0" value="${r.workersCount||''}" placeholder="人" onchange="updRpt('${r.id}','workersCount',+this.value);renderMTab('report')"></div>
        <div class="fg" style="margin:0"><label class="fl">負責人</label><input class="fi" value="${r.manager||''}" placeholder="例：丘小熊" onchange="updRpt('${r.id}','manager',this.value);renderMTab('report')"></div>
      </div>
      <div class="fg" style="margin-bottom:12px"><label class="fl">施工時間</label><input class="fi" value="${r.workHours||''}" placeholder="例：8:00 ~ 17:00" onchange="updRpt('${r.id}','workHours',this.value);renderMTab('report')"></div>
      <div class="fg" style="margin-bottom:12px"><label class="fl">工程說明</label><textarea class="fta" style="min-height:80px" placeholder="今日施工內容、進度說明…" onchange="updRpt('${r.id}','caption',this.value);renderMTab('report')">${r.caption||''}</textarea></div>
      <div class="fl" style="margin-bottom:8px">施工照片${photos.length>0?` (${photos.length}張)`:''}</div>
      ${ph}${photos.length===0?`<div style="text-align:center;padding:20px;background:var(--stone);border-radius:7px;cursor:pointer;color:var(--muted)" onclick="addRptPhoto('${r.id}')">點擊上傳照片</div>`:''}
    </div>`;
  } else {
    editorHtml = '<div style="text-align:center;padding:60px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:10px">尚無日誌，請點上方「＋ 新增日誌」</div>';
  }
  
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px">
    <button class="btn" style="background:var(--bd);color:#fff;border:none" onclick="exportReportPDF()">📄 匯出全部 PDF</button>
    <button class="btn btn-g btn-sm" onclick="addRpt()">＋ 新增日誌</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:start">
    <div style="max-height:600px;overflow-y:auto;padding-right:4px">
      ${listHtml||'<div style="text-align:center;padding:40px;color:var(--muted)">尚無日誌</div>'}
    </div>
    <div>${editorHtml}</div>
  </div>`;
}

function updRpt(id,f,v){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const r=(p.report||[]).find(x=>String(x.id)===String(id));if(r)r[f]=v;}
function updRptCap(id,idx,val){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const r=(p.report||[]).find(x=>String(x.id)===String(id));if(!r)return;if(!r.photoCaptions)r.photoCaptions=[];while(r.photoCaptions.length<=idx)r.photoCaptions.push('');r.photoCaptions[idx]=val;}
function addRpt(){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));if(!p.report)p.report=[];const newRpt={id:Date.now(),date:new Date().toISOString().slice(0,10),weather:'☀️ 晴天',workersCount:1,manager:'',workHours:p.workHours||'8:00 ~ 17:00',photos:[],photoCaptions:[],caption:''};p.report.push(newRpt);window._activeRptId=newRpt.id;renderMTab('report');}
function rmRpt(id){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));p.report=(p.report||[]).filter(x=>String(x.id)!==String(id));renderMTab('report');}
function addRptPhoto(rid){const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.onchange=async e=>{const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const r=(p.report||[]).find(x=>String(x.id)===String(rid));if(r){for(const f of Array.from(e.target.files)){r.photos.push(await compressImage(f));if(!r.photoCaptions)r.photoCaptions=[];r.photoCaptions.push('');}renderMTab('report');}};input.click();}
function rmRptPhoto(rid,i){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const r=(p.report||[]).find(x=>String(x.id)===String(rid));if(r){r.photos.splice(i,1);if(r.photoCaptions)r.photoCaptions.splice(i,1);renderMTab('report');}}

function exportReportPDF(singleRId){
  const p=DB.projects.find(x=>String(x.id)===String(currentProjId));
  if(!p||!(p.report||[]).length){alert('尚無日誌可匯出');return;}
  let sorted=[...p.report].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(singleRId){ sorted = sorted.filter(r=>String(r.id)===String(singleRId)); }
  const pages=[];
  const PERPAGE=4;
  const ownerName = (p.client&&(p.client.contact||p.client.name))||'—';
  
  const buildHeader = (r) => `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:14px">
        <img src="${_LOGO}" style="width:58px;height:58px;border-radius:50%;object-fit:cover;flex-shrink:0">
        <div>
          <div style="font-size:19px;font-weight:700;color:#1a1a1a;letter-spacing:1px">${p.name}</div>
          <div style="font-size:11px;color:#666;margin-top:4px">${p.address||''}${ownerName!=='—'?' | 業主：'+ownerName:''}</div>
        </div>
      </div>
      <div style="text-align:right;font-size:11px;color:#333;line-height:1.85">
        <div>日期：${r.date||'—'}</div>
        <div>時間：${r.workHours||p.workHours||'—'}</div>
        <div>天氣：${(r.weather||'').replace(/[☀️🌤☁️🌧⛈]/gu,'').trim()||'—'}</div>
        <div>負責人：${r.manager||'—'}</div>
      </div>
    </div>`;
  
  const buildWorkers = (r) => `
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <span style="width:4px;height:14px;background:#1a1a1a;display:inline-block"></span>
        <span style="font-size:13px;font-weight:700;color:#1a1a1a">施工人數</span>
      </div>
      <div style="font-size:13px;color:#333;padding-left:10px">${r.workersCount||0} 人</div>
    </div>`;
  
  const buildDesc = (r) => `
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="width:4px;height:14px;background:#1a1a1a;display:inline-block"></span>
        <span style="font-size:13px;font-weight:700;color:#1a1a1a">工程說明</span>
      </div>
      <div style="font-size:12px;color:#333;line-height:1.7;white-space:pre-wrap;padding-left:10px">${r.caption||'（無說明）'}</div>
    </div>`;
  
  const buildPhotos = (photos, caps, offset, totalCount, isFirstOfLog) => {
    let html = '';
    if(isFirstOfLog && totalCount > 0) {
      html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <span style="width:4px;height:14px;background:#1a1a1a;display:inline-block"></span>
        <span style="font-size:13px;font-weight:700;color:#1a1a1a">施工照片（${totalCount} 張）</span>
      </div>`;
    }
    for(let i=0;i<photos.length;i+=2){
      const p1=photos[i], p2=photos[i+1]||null;
      const c1=caps[offset+i]||'（無說明）', c2=caps[offset+i+1]||'（無說明）';
      html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
        <div style="border:1px solid #e0e0e0;border-radius:2px;overflow:hidden;background:#fff">
          <div style="width:100%;height:240px;display:flex;align-items:center;justify-content:center;background:#f8f8f8">
            <img src="${p1}" style="max-width:100%;max-height:240px;object-fit:contain;display:block">
          </div>
          <div style="font-size:11px;color:#444;padding:8px 12px;background:#fafafa;border-top:1px solid #eee;min-height:18px">${c1}</div>
        </div>
        <div style="border:1px solid #e0e0e0;border-radius:2px;overflow:hidden;background:#fff">
          ${p2 ? `
            <div style="width:100%;height:240px;display:flex;align-items:center;justify-content:center;background:#f8f8f8">
              <img src="${p2}" style="max-width:100%;max-height:240px;object-fit:contain;display:block">
            </div>
            <div style="font-size:11px;color:#444;padding:8px 12px;background:#fafafa;border-top:1px solid #eee;min-height:18px">${c2}</div>
          ` : `
            <div style="width:100%;height:240px;background:#fff"></div>
            <div style="font-size:11px;padding:8px 12px;background:#fff;min-height:18px"></div>
          `}
        </div>
      </div>`;
    }
    return html;
  };
  
  sorted.forEach(r => {
    const photos = r.photos||[];
    const caps = r.photoCaptions||[];
    pages.push(`<div class="rpt-pg">
      ${buildHeader(r)}
      ${buildWorkers(r)}
      ${buildDesc(r)}
      ${buildPhotos(photos.slice(0, PERPAGE), caps, 0, photos.length, true)}
      <div class="rpt-foot">
        <span>FORM FEEL · 施工日誌</span>
        <span>第 ${pages.length+1} 頁</span>
      </div>
    </div>`);
    for(let start=PERPAGE; start<photos.length; start+=PERPAGE){
      const chunk = photos.slice(start, start+PERPAGE);
      pages.push(`<div class="rpt-pg">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:8px">
          <img src="${_LOGO}" style="width:24px;height:24px;border-radius:50%;object-fit:cover">
          <span style="font-size:12px;font-weight:600">${p.name}</span>
          <span style="font-size:12px;color:#888;margin-left:8px">${r.date||''}</span>
        </div>
        ${buildPhotos(chunk, caps, start, photos.length, false)}
        <div class="rpt-foot">
          <span>FORM FEEL · 施工日誌</span>
          <span>第 ${pages.length+1} 頁</span>
        </div>
      </div>`);
    }
  });
  
  let overlay=document.getElementById('rpt-pdf-overlay');
  if(overlay) overlay.remove();
  overlay=document.createElement('div');
  overlay.id='rpt-pdf-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;flex-direction:column;align-items:center;padding:20px;overflow-y:auto';
  overlay.innerHTML=`
    <style>
      .rpt-pg{padding:18mm 16mm;box-sizing:border-box;min-height:270mm;position:relative;background:#fff;margin-bottom:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif}
      .rpt-foot{position:absolute;bottom:8mm;left:16mm;right:16mm;font-size:9px;color:#999;display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid #eee}
      @media print{
        body>*:not(#rpt-pdf-overlay){display:none!important}
        #rpt-pdf-overlay{position:static!important;background:none!important;padding:0!important;overflow:visible!important}
        #rpt-pdf-overlay>div{box-shadow:none!important;border-radius:0!important}
        .rpt-pg{page-break-after:always;margin:0!important}
        .rpt-pg:last-child{page-break-after:auto}
        .rpt-hdr-bar{display:none!important}
      }
    </style>
    <div style="background:#fff;border-radius:10px;width:100%;max-width:860px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)">
      <div class="rpt-hdr-bar" style="background:#3C2414;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
        <span style="font-weight:700">施工日誌 — ${p.name}</span>
        <div style="display:flex;gap:8px">
          <button onclick="window.print()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">🖨️ 列印 / 存 PDF</button>
          <button onclick="document.getElementById('rpt-pdf-overlay').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px">✕</button>
        </div>
      </div>
      <div style="padding:10px;background:#eee">${pages.join('')}</div>
    </div>`;
  document.body.appendChild(overlay);
}

// 開支明細
function renderExpensesTab(p){
  if(!p.expenses)p.expenses=[];
  const labor=(p.schedule||[]).reduce((a,s)=>a+(s.dailyRate*(parseFloat(s.days)||1)),0);
  const days=(p.schedule||[]).reduce((a,s)=>a+(parseFloat(s.days)||1),0);
  const meal=days*(p.mealAllowance||200),fuel=p.fuelCost||0;
  const acc=(p.accommodation?.cost||0)*(p.accommodation?.days||0);
  const matCost=(p.materials||[]).filter(m=>!m.isOwned).reduce((a,m)=>a+(m.price||0)*(m.qty||1),0);
  const expTotal=(p.expenses||[]).reduce((a,e)=>a+e.amount,0);
  const total=labor+meal+fuel+acc+matCost+expTotal;
  const contract=p.client?.contractAmt||0;
  const recv=(p.payments||[]).filter(x=>x.received).reduce((a,b)=>a+b.amount,0);
  const profit=contract-total;
  const fmtM=n=>'NT$ '+(n||0).toLocaleString();
  const rows=(p.expenses||[]).map(e=>`<tr>
    <td><input class="fi" type="date" style="width:128px;font-size:12px;padding:4px 7px" value="${e.date||''}" onchange="updExp('${e.id}','date',this.value)"></td>
    <td><input class="fi" style="font-size:12px;padding:4px 7px" value="${e.item||''}" placeholder="說明" onchange="updExp('${e.id}','item',this.value)"></td>
    <td><input class="fi" type="number" style="width:100px;font-size:12px;padding:4px 7px" value="${e.amount||0}" onchange="updExp('${e.id}','amount',+this.value);renderMTab('expenses')"></td>
    <td><select class="fs" style="font-size:12px;padding:4px 7px;width:80px" onchange="updExp('${e.id}','reimbursed',this.value==='true');renderMTab('expenses')"><option ${e.reimbursed?'selected':''} value="true">✓已還</option><option ${!e.reimbursed?'selected':''} value="false">⏳未還</option></select></td>
    <td><button class="btn btn-d btn-xs" onclick="rmExp('${e.id}')">✕</button></td>
  </tr>`).join('');
  return `<div style="background:${profit>=0?'linear-gradient(120deg,#3A5A3A,#5A7A5A)':'linear-gradient(120deg,#8A3A2A,#A05040)'};color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div style="flex:1"><div style="font-size:10px;opacity:.7">合約金額</div><div style="font-size:17px;font-weight:700">${fmtM(contract)}</div></div>
    <div style="opacity:.4;font-size:18px">−</div>
    <div style="flex:1"><div style="font-size:10px;opacity:.7">總支出</div><div style="font-size:17px;font-weight:700">${fmtM(total)}</div></div>
    <div style="opacity:.4;font-size:18px">=</div>
    <div style="flex:1"><div style="font-size:10px;opacity:.7">毛利</div><div style="font-size:20px;font-weight:800">${fmtM(profit)}</div></div>
  </div>
  <div class="sc-card" style="margin-bottom:14px"><div class="sc-title">支出明細（自動計算）</div>
    ${[['🔨 工資（'+days.toFixed(1)+'工）',labor],['🍱 餐費',meal],['⛽ 油資',fuel],['🏠 住宿（'+(p.accommodation?.days||0)+'晚）',acc],['📦 備品採購',matCost],['💳 代墊項目',expTotal]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--stone);font-size:13px"><span style="color:var(--muted)">${l}</span><span style="font-weight:700">${fmtM(v)}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;padding:10px 14px;background:var(--bd);color:#fff;border-radius:8px;font-weight:700;font-size:14px;margin-top:8px"><span>總支出</span><span>${fmtM(total)}</span></div>
  </div>
  <div class="sc-card"><div class="sc-title">代墊項目</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn btn-g btn-sm" onclick="addExp()">＋ 新增代墊</button></div>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>日期</th><th>說明</th><th>金額</th><th>狀態</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:12px">尚無代墊記錄</td></tr>'}</tbody></table></div>
  </div>`;
}
function updExp(id,f,v){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));const e=(p.expenses||[]).find(x=>String(x.id)===String(id));if(e)e[f]=v;}
function addExp(){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));if(!p.expenses)p.expenses=[];p.expenses.push({id:Date.now(),date:new Date().toISOString().slice(0,10),item:'',amount:0,note:'',reimbursed:false});renderMTab('expenses');}
function rmExp(id){const p=DB.projects.find(x=>String(x.id)===String(currentProjId));p.expenses=(p.expenses||[]).filter(x=>String(x.id)!==String(id));renderMTab('expenses');}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
loadAll();
</script>
</body>
